<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>독서 대나무숲 - 함께 나누는 독서 질문 공간</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (v9 호환 모드) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f2f7f4;
      word-break: keep-all;
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .bamboo-bg {
      background-color: #e2efe8;
      background-image: radial-gradient(#2d6a4f 0.5px, transparent 0.5px), radial-gradient(#2d6a4f 0.5px, #e2efe8 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .keep-all {
      word-break: keep-all;
    }
    .postit-card {
      box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      border-bottom-right-radius: 18px 4px;
      transition: all 0.2s ease-in-out;
    }
    .postit-card:hover {
      transform: translateY(-4px) rotate(0deg) scale(1.01) !important;
      box-shadow: 6px 12px 20px rgba(0, 0, 0, 0.12);
    }
    .postit-red { background-color: #ffe8e8; border-color: #fca5a5; }
    .postit-green { background-color: #eafaf1; border-color: #86efac; }
    .postit-blue { background-color: #eef7ff; border-color: #93c5fd; }
    .postit-yellow { background-color: #fffde7; border-color: #fde047; }
  </style>
</head>
<body class="bamboo-bg min-h-screen text-gray-800 flex flex-col text-base">

  <!-- Header -->
  <header class="bg-emerald-800 text-white shadow-lg py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎋</span>
        <div>
          <h1 class="text-2xl sm:text-3xl font-jua tracking-wide">독서 대나무숲</h1>
          <p class="text-xs sm:text-sm text-emerald-200">생각을 자유롭게 털어놓는 우리들의 독서 질문 공간</p>
        </div>
      </div>
      <div id="room-info-bar" class="hidden flex flex-wrap items-center justify-center gap-3 bg-emerald-900/80 px-4 py-2 rounded-xl border border-emerald-600">
        <div class="text-sm sm:text-base">
          <span class="text-emerald-300 font-bold">참가자:</span>
          <span class="text-white font-semibold" id="bar-user-badge">닉네임</span>
        </div>
        <button type="button" id="btn-admin-toggle" onclick="toggleAdminMode()" class="text-xs sm:text-sm bg-amber-500 hover:bg-amber-600 px-3 py-1 rounded text-emerald-950 transition font-bold cursor-pointer shadow">
          <i class="fa-solid fa-lock mr-1" id="admin-icon"></i><span id="admin-btn-text">관리자 모드</span>
        </button>
        <button type="button" onclick="exitRoom()" class="text-xs sm:text-sm bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white transition font-bold cursor-pointer">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>닉네임 변경
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">

    <!-- AUTH VIEW (닉네임 입력) -->
    <div id="auth-view" class="max-w-md mx-auto my-12 bg-white/95 backdrop-blur-sm rounded-3xl p-8 shadow-xl border-2 border-emerald-200">
      <div class="text-center mb-8">
        <span class="text-6xl inline-block mb-2">🎋</span>
        <h2 class="text-2xl sm:text-3xl font-jua text-emerald-900">독서 대나무숲 입장하기</h2>
        <p class="text-sm sm:text-base text-gray-500 mt-1">질문으로 깊어지는 생각의 숲</p>
      </div>

      <form id="student-form" class="space-y-5">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-2">본인의 이름 또는 닉네임을 입력해 주세요</label>
          <input type="text" id="student-name" required placeholder="예: 5학년 김독서" class="w-full px-4 py-3.5 rounded-xl border border-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-base">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition cursor-pointer">
          대나무숲 들어가기 🎋
        </button>
      </form>
    </div>

    <!-- BOARD VIEW -->
    <div id="board-view" class="hidden space-y-6">

      <!-- Question Input Form Box -->
      <div class="bg-white/95 rounded-2xl p-5 sm:p-6 shadow-lg border border-emerald-200">
        <h3 class="text-base sm:text-lg font-jua text-emerald-900 mb-3 flex items-center gap-2">
          <span>✍️</span> 읽은 단원(쪽수)과 질문 유형을 선택하고 독서 질문을 포스트잇으로 붙여보세요!
        </h3>
        <form id="question-form" class="space-y-4">
          
          <!-- Section Selector Dropdown -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">📖 질문할 책의 부분 선택:</label>
            <select id="section-select" required class="w-full p-3 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-950 font-bold text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="section1">1) 깨진 삼각형, 새사람, 센터, 북소리, 대숲1 (7쪽~42쪽)</option>
              <option value="section2">2) 사고, 밍밍한 망고, 목격자, 신발장, 대숲2 (43쪽~84쪽)</option>
              <option value="section3">3) 그늘 속으로, 진흙탕 (85쪽~107쪽)</option>
              <option value="section4">4) 흉터의 의미, 내가 만든 가시, 대숲3, 떨리는 손, 남겨 둔 것 (108쪽~147쪽)</option>
              <option value="section5">5) 새잎, 햇빛 (148쪽~170쪽)</option>
            </select>
          </div>

          <!-- Pastel Question Category Buttons -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1.5">🏷️ 질문 유형 (포스트잇 색상 선택):</label>
            <div class="flex flex-wrap gap-2">
              <button type="button" data-cat-btn="인물" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-red-100 text-red-900 border-2 border-red-400 shadow-xs cursor-pointer">🔴 인물의 마음 질문 (분홍)</button>
              <button type="button" data-cat-btn="만약에" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-green-50 cursor-pointer">🟢 만약에? 질문 (연두)</button>
              <button type="button" data-cat-btn="현실" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-blue-50 cursor-pointer">🔵 현실 세계 연결 (하늘)</button>
              <button type="button" data-cat-btn="자유" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-yellow-50 cursor-pointer">🟡 자유 질문 (노랑)</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2 pt-1">
            <textarea id="question-text" required rows="2" placeholder="책을 읽으며 궁금했던 점이나 친구들과 함께 나누고 싶은 질문을 적어보세요." class="flex-1 p-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm sm:text-base resize-none"></textarea>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-jua px-6 py-3 sm:py-0 rounded-xl shadow-md transition flex items-center justify-center text-base sm:text-lg whitespace-nowrap cursor-pointer">
              포스트잇 붙이기 📌
            </button>
          </div>
        </form>
      </div>

      <!-- Filter Bar -->
      <div class="bg-white/90 p-4 rounded-2xl border border-emerald-200 space-y-3">
        <!-- 1) 쪽수 필터 -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1">
          <span class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap">📖 쪽수 필터:</span>
          <button type="button" data-sec-filter="all" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer">전체보기</button>
          <button type="button" data-sec-filter="section1" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-100 whitespace-nowrap cursor-pointer">1) 7~42쪽</button>
          <button type="button" data-sec-filter="section2" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-amber-100 whitespace-nowrap cursor-pointer">2) 43~84쪽</button>
          <button type="button" data-sec-filter="section3" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-100 whitespace-nowrap cursor-pointer">3) 85~107쪽</button>
          <button type="button" data-sec-filter="section4" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-purple-100 whitespace-nowrap cursor-pointer">4) 108~147쪽</button>
          <button type="button" data-sec-filter="section5" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-rose-100 whitespace-nowrap cursor-pointer">5) 148~170쪽</button>
        </div>

        <!-- 2) 질문 유형 필터 -->
        <div class="flex items-center justify-between flex-wrap gap-2 pt-2 border-t border-emerald-100">
          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            <span class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap">🏷️ 유형 필터:</span>
            <button type="button" data-cat-filter="all" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer">전체유형</button>
            <button type="button" data-cat-filter="인물" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-red-100 whitespace-nowrap cursor-pointer">🔴 인물의 마음</button>
            <button type="button" data-cat-filter="만약에" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-green-100 whitespace-nowrap cursor-pointer">🟢 만약에?</button>
            <button type="button" data-cat-filter="현실" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-100 whitespace-nowrap cursor-pointer">🔵 현실 세계 연결</button>
            <button type="button" data-cat-filter="자유" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-yellow-100 whitespace-nowrap cursor-pointer">🟡 자유 질문</button>
          </div>
          <div class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap ml-auto">
            모인 질문 <span id="question-count" class="text-emerald-600 font-mono text-base">0</span>개
          </div>
        </div>
      </div>

      <!-- Question Cards Grid (Post-it Board) -->
      <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamic Post-it Cards -->
      </div>
    </div>

  </main>

  <script>
    // 선생님의 파이어베이스 설정값
    var firebaseConfig = {
      apiKey: "AIzaSyDJvNknk2h_gzRiyXU4NtFMP3x9Gy3Ph-4",
      authDomain: "yowonssam.firebaseapp.com",
      projectId: "yowonssam",
      storageBucket: "yowonssam.firebasestorage.app",
      messagingSenderId: "862947533694",
      appId: "1:862947533694:web:694bb1c09c01cd05b7092f",
      measurementId: "G-W50B41EYLR"
    };

    // Firebase 안전 초기화
    var db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
    } catch (err) {
      console.error("Firebase 초기화 오류:", err);
    }

    var currentUser = { name: '' };
    var isAdminMode = false;
    var adminPassword = '2026';
    var activeSecFilter = 'all';
    var activeCatFilter = 'all';
    var currentCategory = '인물';
    var questions = [];
    var unsubscribe = null;

    var sections = {
      'section1': { name: '1) 7쪽~42쪽', color: 'bg-emerald-200 text-emerald-950 border-emerald-400' },
      'section2': { name: '2) 43쪽~84쪽', color: 'bg-amber-200 text-amber-950 border-amber-400' },
      'section3': { name: '3) 85쪽~107쪽', color: 'bg-blue-200 text-blue-950 border-blue-400' },
      'section4': { name: '4) 108쪽~147쪽', color: 'bg-purple-200 text-purple-950 border-purple-400' },
      'section5': { name: '5) 148쪽~170쪽', color: 'bg-rose-200 text-rose-950 border-rose-400' }
    };

    var categoryStyles = {
      '인물': { tag: '🔴 인물의 마음', class: 'postit-red', topBar: 'bg-red-400', badgeBg: 'bg-red-200 text-red-950 border-red-300' },
      '만약에': { tag: '🟢 만약에?', class: 'postit-green', topBar: 'bg-green-400', badgeBg: 'bg-green-200 text-green-950 border-green-300' },
      '현실': { tag: '🔵 현실 세계 연결', class: 'postit-blue', topBar: 'bg-blue-400', badgeBg: 'bg-blue-200 text-blue-950 border-blue-300' },
      '자유': { tag: '🟡 자유 질문', class: 'postit-yellow', topBar: 'bg-yellow-400', badgeBg: 'bg-yellow-200 text-yellow-950 border-yellow-300' }
    };

    function initApp() {
      try {
        var savedUser = sessionStorage.getItem('bamboo_student_name');
        if (savedUser) {
          currentUser.name = savedUser;
          loadBoardView();
          return;
        }
      } catch (e) {}
      
      document.getElementById('auth-view').classList.remove('hidden');
      document.getElementById('board-view').classList.add('hidden');
      document.getElementById('room-info-bar').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', function() {
      var studentForm = document.getElementById('student-form');
      if (studentForm) {
        studentForm.addEventListener('submit', handleStudentJoin);
      }
      
      var questionForm = document.getElementById('question-form');
      if (questionForm) {
        questionForm.addEventListener('submit', handleAddQuestion);
      }

      var catBtns = document.querySelectorAll('[data-cat-btn]');
      catBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          selectCategory(btn.getAttribute('data-cat-btn'));
        });
      });

      var secFilterBtns = document.querySelectorAll('[data-sec-filter]');
      secFilterBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          filterBySection(btn.getAttribute('data-sec-filter'));
        });
      });

      var catFilterBtns = document.querySelectorAll('[data-cat-filter]');
      catFilterBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          filterByCategory(btn.getAttribute('data-cat-filter'));
        });
      });

      initApp();
    });

    function handleStudentJoin(e) {
      e.preventDefault();
      var nameInput = document.getElementById('student-name');
      if (!nameInput) return;
      var name = nameInput.value.trim();
      if (!name) return;

      currentUser.name = name;
      try {
        sessionStorage.setItem('bamboo_student_name', name);
      } catch (e) {}
      
      loadBoardView();
    }

    function loadBoardView() {
      var authView = document.getElementById('auth-view');
      var boardView = document.getElementById('board-view');
      var roomInfoBar = document.getElementById('room-info-bar');
      var userBadge = document.getElementById('bar-user-badge');

      if (authView) authView.classList.add('hidden');
      if (boardView) boardView.classList.remove('hidden');
      if (roomInfoBar) roomInfoBar.classList.remove('hidden');
      if (userBadge) userBadge.innerText = currentUser.name;

      if (!db) {
        renderQuestions();
        return;
      }

      if (unsubscribe) unsubscribe();
      unsubscribe = db.collection('questions').orderBy('createdAt', 'desc').onSnapshot(function(snapshot) {
        questions = [];
        snapshot.forEach(function(doc) {
          var data = doc.data();
          data.docId = doc.id;
          questions.push(data);
        });
        renderQuestions();
      }, function(error) {
        console.error("데이터 동기화 오류: ", error);
        renderQuestions();
      });
    }

    function exitRoom() {
      try {
        sessionStorage.removeItem('bamboo_student_name');
      } catch (e) {}
      if (unsubscribe) unsubscribe();
      location.reload();
    }

    window.toggleLike = function(docId) {
      var q = questions.find(function(item) { return item.docId === docId; });
      if(q && db) {
        if(!q.likedUsers) q.likedUsers = [];
        var idx = q.likedUsers.indexOf(currentUser.name);
        if(idx > -1) {
          q.likedUsers.splice(idx, 1);
          q.likes--;
        } else {
          q.likedUsers.push(currentUser.name);
          q.likes++;
        }
        db.collection('questions').doc(docId).update({
          likes: q.likes,
          likedUsers: q.likedUsers
        });
      }
    };

    window.toggleAdminMode = function() {
      if (!isAdminMode) {
        var pw = prompt('선생님 관리자 비밀번호를 입력하세요:');
        if (pw === adminPassword) {
          isAdminMode = true;
          document.getElementById('admin-icon').className = 'fa-solid fa-unlock mr-1';
          document.getElementById('admin-btn-text').innerText = '관리자 해제';
          document.getElementById('btn-admin-toggle').className = 'text-xs sm:text-sm bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-white transition font-bold cursor-pointer shadow';
          alert('관리자 모드가 활성화되었습니다. 모든 질문과 댓글을 수정/삭제할 수 있습니다.');
          renderQuestions();
        } else if (pw !== null) {
          alert('비밀번호가 일치하지 않습니다.');
        }
      } else {
        isAdminMode = false;
        document.getElementById('admin-icon').className = 'fa-solid fa-lock mr-1';
        document.getElementById('admin-btn-text').innerText = '관리자 모드';
        document.getElementById('btn-admin-toggle').className = 'text-xs sm:text-sm bg-amber-500 hover:bg-amber-600 px-3 py-1 rounded text-emerald-950 transition font-bold cursor-pointer shadow';
        alert('관리자 모드가 해제되었습니다.');
        renderQuestions();
      }
    };

    window.editQuestion = function(docId) {
      if (!isAdminMode || !db) return;
      var q = questions.find(function(item) { return item.docId === docId; });
      if (!q) return;

      var newText = prompt('질문 내용을 수정해 주세요 (맞춤법/표현 지도):', q.text);
      if (newText !== null && newText.trim() !== '') {
        db.collection('questions').doc(docId).update({
          text: newText.trim()
        });
      }
    };

    window.deleteQuestion = function(docId) {
      if (!isAdminMode || !db) return;
      if (confirm('이 포스트잇 질문을 삭제하시겠습니까?')) {
        db.collection('questions').doc(docId).delete();
      }
    };

    window.addComment = function(docId, event) {
      event.preventDefault();
      var input = document.getElementById('comment-input-' + docId);
      if (!input) return;
      var text = input.value.trim();
      if(!text || !db) return;

      var q = questions.find(function(item) { return item.docId === docId; });
      if(q) {
        if(!q.comments) q.comments = [];
        q.comments.push({ id: Date.now() + Math.random(), author: currentUser.name, text: text });
        db.collection('questions').doc(docId).update({
          comments: q.comments
        });
      }
    };

    window.deleteComment = function(docId, cId) {
      var q = questions.find(function(item) { return item.docId === docId; });
      if(q && db) {
        var targetC = q.comments.find(function(c) { return c.id === cId; });
        if (!targetC) return;

        if (targetC.author === currentUser.name || isAdminMode) {
          if (confirm('이 댓글을 삭제하시겠습니까?')) {
            q.comments = q.comments.filter(function(c) { return c.id !== cId; });
            db.collection('questions').doc(docId).update({
              comments: q.comments
            });
          }
        } else {
          alert('본인이 작성한 댓글만 삭제할 수 있습니다.');
        }
      }
    };

    function selectCategory(cat) {
      currentCategory = cat;
      var btns = document.querySelectorAll('[data-cat-btn]');
      btns.forEach(function(btn) {
        var bCat = btn.getAttribute('data-cat-btn');
        if(bCat === cat) {
          var catClass = cat === '인물' ? 'bg-red-100 text-red-900 border-red-400' : cat === '만약에' ? 'bg-green-100 text-green-900 border-green-400' : cat === '현실' ? 'bg-blue-100 text-blue-900 border-blue-400' : 'bg-yellow-100 text-yellow-900 border-yellow-400';
          btn.className = 'cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold ' + catClass + ' border-2 shadow-xs cursor-pointer';
        } else {
          btn.className = 'cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-gray-100 cursor-pointer';
        }
      });
    }

    function filterBySection(sec) {
      activeSecFilter = sec;
      var btns = document.querySelectorAll('[data-sec-filter]');
      btns.forEach(function(btn) {
        var btnSec = btn.getAttribute('data-sec-filter');
        if (btnSec === sec) {
          btn.className = 'sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer';
        } else {
          btn.className = 'sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-50 whitespace-nowrap cursor-pointer';
        }
      });
      renderQuestions();
    }

    function filterByCategory(cat) {
      activeCatFilter = cat;
      var btns = document.querySelectorAll('[data-cat-filter]');
      btns.forEach(function(btn) {
        var btnCat = btn.getAttribute('data-cat-filter');
        if (btnCat === cat) {
          btn.className = 'cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer';
        } else {
          btn.className = 'cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-50 whitespace-nowrap cursor-pointer';
        }
      });
      renderQuestions();
    }

    function handleAddQuestion(e) {
      e.preventDefault();
      var secSelect = document.getElementById('section-select');
      var textInput = document.getElementById('question-text');
      if (!secSelect || !textInput) return;

      var sec = secSelect.value;
      var text = textInput.value.trim();
      if (!text || !db) return;

      var q = {
        author: currentUser.name,
        sectionKey: sec,
        category: currentCategory,
        text: text,
        likes: 0,
        likedUsers: [],
        comments: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection('questions').add(q).then(function() {
        textInput.value = '';
      }).catch(function(error) {
        console.error("질문 등록 실패: ", error);
        alert("질문 등록에 실패했습니다. 네트워크를 확인해 주세요.");
      });
    }

    function renderQuestions() {
      var grid = document.getElementById('questions-grid');
      var countSpan = document.getElementById('question-count');
      if (!grid) return;
      
      var filtered = questions.filter(function(q) {
        var secMatch = (activeSecFilter === 'all' || q.sectionKey === activeSecFilter);
        var catMatch = (activeCatFilter === 'all' || q.category === activeCatFilter);
        return secMatch && catMatch;
      });
      
      if (countSpan) countSpan.innerText = filtered.length;
      grid.innerHTML = '';

      filtered.forEach(function(q, idx) {
        var secInfo = sections[q.sectionKey] || sections['section1'];
        var catInfo = categoryStyles[q.category] || categoryStyles['자유'];
        var isLiked = q.likedUsers && q.likedUsers.includes(currentUser.name);

        var rotDeg = (idx % 3 === 0 ? -1.2 : idx % 3 === 1 ? 1.2 : -0.5);

        var card = document.createElement('div');
        card.style.transform = 'rotate(' + rotDeg + 'deg)';
        card.className = 'postit-card ' + catInfo.class + ' border-2 rounded-2xl overflow-hidden flex flex-col justify-between relative';
        
        var commentsHtml = (q.comments || []).map(function(c) {
          var canDeleteComment = (c.author === currentUser.name || isAdminMode);
          return '<div class="text-xs sm:text-sm bg-white/90 p-2 rounded-lg border border-gray-200/80 flex justify-between items-center shadow-2xs">' +
            '<div class="keep-all"><span class="font-bold text-emerald-900">' + c.author + ':</span> <span class="text-gray-800">' + c.text + '</span></div>' +
            (canDeleteComment ? '<button type="button" onclick="deleteComment(\'' + q.docId + '\', ' + c.id + ')" class="text-red-500 hover:text-red-700 text-xs ml-1 font-bold cursor-pointer">×</button>' : '') +
          '</div>';
        }).join('');

        if (!q.comments || q.comments.length === 0) {
          commentsHtml = '<p class="text-xs sm:text-sm text-gray-400 text-center py-1">첫 댓글을 남겨보세요!</p>';
        }

        var adminActionBtns = '';
        if (isAdminMode) {
          adminActionBtns = '<div class="flex items-center gap-1">' +
            '<button type="button" onclick="editQuestion(\'' + q.docId + '\')" class="text-sm text-blue-700 hover:text-blue-900 font-bold px-1 cursor-pointer" title="질문 수정">✏️</button>' +
            '<button type="button" onclick="deleteQuestion(\'' + q.docId + '\')" class="text-sm text-red-600 hover:text-red-800 font-bold px-1 cursor-pointer" title="질문 삭제">🗑️</button>' +
          '</div>';
        }

        card.innerHTML = 
          '<div class="' + catInfo.topBar + ' h-2.5 w-full opacity-80"></div>' +
          '<div class="p-5 pt-3">' +
            '<div class="flex flex-wrap justify-between items-center gap-1 mb-2">' +
              '<div class="flex flex-wrap gap-1 items-center">' +
                '<span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full ' + secInfo.color + ' border truncate">' + secInfo.name + '</span>' +
                '<span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full ' + catInfo.badgeBg + ' border truncate">' + catInfo.tag + '</span>' +
              '</div>' +
              adminActionBtns +
            '</div>' +
            '<p class="text-gray-900 text-base sm:text-lg font-medium leading-relaxed my-3 whitespace-pre-wrap keep-all">"' + q.text + '"</p>' +
          '</div>' +
          '<div class="p-5 pt-0">' +
            '<div class="flex justify-between items-center text-xs sm:text-sm text-gray-600 pt-2 border-t border-black/10 mb-3">' +
              '<span class="font-bold text-gray-900">✍️ ' + q.author + '</span>' +
              '<button type="button" onclick="toggleLike(\'' + q.docId + '\')" class="flex items-center gap-1 font-bold ' + (isLiked ? 'text-red-600' : 'text-gray-500 hover:text-red-500') + ' transition cursor-pointer">' +
                '<i class="' + (isLiked ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i>' +
                '<span>공감 ' + q.likes + '</span>' +
              '</button>' +
            '</div>' +
            '<div class="space-y-2 bg-white/70 rounded-xl p-2.5 border border-black/5">' +
              '<div class="space-y-1.5 max-h-36 overflow-y-auto pr-1">' + commentsHtml + '</div>' +
              '<form onsubmit="addComment(\'' + q.docId + '\', event)" class="flex gap-1 mt-2">' +
                '<input type="text" id="comment-input-' + q.docId + '" placeholder="댓글 작성..." class="flex-1 px-2.5 py-1.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white">' +
                '<button type="submit" class="bg-emerald-700 text-white text-xs sm:text-sm px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-800 whitespace-nowrap shadow-xs cursor-pointer">등록</button>' +
              '</form>' +
            '</div>' +
          '</div>';

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
