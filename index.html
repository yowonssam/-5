<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>독서 대나무숲 - 함께 나누는 독서 질문 공간</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f2f7f4;
      word-break: keep-all; /* 외톨이 글자 방지 */
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .bamboo-bg {
      background-color: #e2efe8;
      background-image: radial-gradient(#2d6a4f 0.5px, transparent 0.5px), radial-gradient(#2d6a4f 0.5px, #e2efe8 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .keep-all {
      word-break: keep-all;
    }

    /* 파스텔 포스트잇 메모지 스타일 */
    .postit-card {
      box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      border-bottom-right-radius: 18px 4px;
      transition: all 0.2s ease-in-out;
    }
    .postit-card:hover {
      transform: translateY(-4px) rotate(0deg) scale(1.01) !important;
      box-shadow: 6px 12px 20px rgba(0, 0, 0, 0.12);
    }
    .postit-red { background-color: #ffe8e8; border-color: #fca5a5; }
    .postit-green { background-color: #eafaf1; border-color: #86efac; }
    .postit-blue { background-color: #eef7ff; border-color: #93c5fd; }
    .postit-yellow { background-color: #fffde7; border-color: #fde047; }
  </style>
</head>
<body class="bamboo-bg min-h-screen text-gray-800 flex flex-col text-base">

  <!-- Header -->
  <header class="bg-emerald-800 text-white shadow-lg py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎋</span>
        <div>
          <h1 class="text-2xl sm:text-3xl font-jua tracking-wide">독서 대나무숲</h1>
          <p class="text-xs sm:text-sm text-emerald-200">생각을 자유롭게 털어놓는 우리들의 독서 질문 공간</p>
        </div>
      </div>
      <div id="room-info-bar" class="hidden flex flex-wrap items-center justify-center gap-3 bg-emerald-900/80 px-4 py-2 rounded-xl border border-emerald-600">
        <div class="text-sm sm:text-base">
          <span class="text-emerald-300 font-bold" id="bar-book-title">도서명</span>
          <span class="mx-1 text-emerald-400">|</span>
          <span class="text-white font-semibold" id="bar-room-title">방 제목</span>
          <span class="ml-2 text-xs sm:text-sm bg-emerald-700 px-2 py-0.5 rounded text-emerald-200 font-bold" id="bar-user-badge">역할</span>
        </div>
        <div class="bg-amber-400 text-emerald-950 px-3 py-1 rounded-lg font-bold text-sm sm:text-base shadow">
          초대코드: <span id="bar-invite-code" class="tracking-widest font-mono text-base sm:text-lg">------</span>
        </div>
        <button id="btn-delete-room" onclick="deleteEntireRoom()" class="hidden text-xs sm:text-sm bg-red-700 hover:bg-red-800 px-3 py-1 rounded text-white transition font-bold">
          <i class="fa-solid fa-trash mr-1"></i>방 삭제
        </button>
        <button onclick="exitRoom()" class="text-xs sm:text-sm bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white transition font-bold">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>나가기
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">

    <!-- AUTH VIEW -->
    <div id="auth-view" class="max-w-md mx-auto my-10 bg-white/95 backdrop-blur-sm rounded-3xl p-8 shadow-xl border-2 border-emerald-200">
      <div class="text-center mb-8">
        <span class="text-6xl inline-block mb-2">🎍</span>
        <h2 class="text-2xl sm:text-3xl font-jua text-emerald-900">독서 대나무숲 입장하기</h2>
        <p class="text-sm sm:text-base text-gray-500 mt-1">질문으로 깊어지는 생각의 숲</p>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="flex bg-emerald-100 p-1.5 rounded-2xl mb-6">
        <button id="tab-student" onclick="switchTab('student')" class="flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm">
          👨‍🎓 학생 입장
        </button>
        <button id="tab-teacher-create" onclick="switchTab('teacher-create')" class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900">
          👩‍🏫 방 개설
        </button>
        <button id="tab-teacher-login" onclick="switchTab('teacher-login')" class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900">
          🔑 관리자 재입장
        </button>
      </div>

      <!-- Student Form -->
      <form id="student-form" onsubmit="handleStudentJoin(event)" class="space-y-4">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">이름 또는 닉네임</label>
          <input type="text" id="student-name" required placeholder="예: 5학년 김독서" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">선생님이 알려주신 6자리 초대코드</label>
          <input type="text" id="student-code" required maxlength="6" placeholder="예: B9A2K7" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-base sm:text-lg font-mono tracking-widest uppercase">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition">
          대나무숲 들어가기 🎋
        </button>
      </form>

      <!-- Teacher Create Form -->
      <form id="teacher-create-form" onsubmit="handleTeacherCreate(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">방 제목 (학급명)</label>
          <input type="text" id="teacher-room" required placeholder="예: 5학년 2반 독서 대나무숲" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">함께 읽는 책 제목</label>
          <input type="text" id="teacher-book" required placeholder="예: 수남이의 편지" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">선생님 성함</label>
          <input type="text" id="teacher-name" required placeholder="예: 박선생님" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">관리자 비밀번호 (4자리 숫자)</label>
          <input type="password" id="teacher-password" required maxlength="4" placeholder="예: 1234" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base font-mono">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition">
          새 대나무숲 열기 ✨
        </button>
      </form>

      <!-- Teacher Admin Login Form -->
      <form id="teacher-login-form" onsubmit="handleTeacherLogin(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">방 초대코드 (6자리)</label>
          <input type="text" id="login-code" required maxlength="6" placeholder="예: B9A2K7" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-base sm:text-lg font-mono tracking-widest uppercase">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">관리자 비밀번호 (4자리)</label>
          <input type="password" id="login-password" required maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base font-mono">
        </div>
        <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition">
          관리자 권한으로 입장 🔑
        </button>
      </form>
    </div>

    <!-- BOARD VIEW -->
    <div id="board-view" class="hidden space-y-6">

      <!-- Question Input Form Box -->
      <div class="bg-white/95 rounded-2xl p-5 sm:p-6 shadow-lg border border-emerald-200">
        <h3 class="text-base sm:text-lg font-jua text-emerald-900 mb-3 flex items-center gap-2">
          <span>✍️</span> 읽은 단원(쪽수)과 질문 유형을 선택하고 독서 질문을 포스트잇으로 붙여보세요!
        </h3>
        <form onsubmit="handleAddQuestion(event)" class="space-y-4">
          
          <!-- Section Selector Dropdown -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">📖 질문할 책의 부분 선택:</label>
            <select id="section-select" required class="w-full p-3 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-950 font-bold text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="section1">1) 깨진 삼각형, 새사람, 센터, 북소리, 대숲1 (7쪽~42쪽)</option>
              <option value="section2">2) 사고, 밍밍한 망고, 목격자, 신발장, 대숲2 (43쪽~84쪽)</option>
              <option value="section3">3) 그늘 속으로, 진흙탕 (85쪽~107쪽)</option>
              <option value="section4">4) 흉터의 의미, 내가 만든 가시, 대숲3, 떨리는 손, 남겨 둔 것 (108쪽~147쪽)</option>
              <option value="section5">5) 새잎, 햇빛 (148쪽~170쪽)</option>
            </select>
          </div>

          <!-- Pastel Question Category Buttons -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1.5">🏷️ 질문 유형 (포스트잇 색상 선택):</label>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="selectCategory('인물')" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-red-100 text-red-900 border-2 border-red-400 shadow-xs">🔴 인물의 마음 질문 (분홍)</button>
              <button type="button" onclick="selectCategory('만약에')" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-green-50">🟢 만약에? 질문 (연두)</button>
              <button type="button" onclick="selectCategory('현실')" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-blue-50">🔵 현실 세계 연결 (하늘)</button>
              <button type="button" onclick="selectCategory('자유')" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-yellow-50">🟡 자유 질문 (노랑)</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2 pt-1">
            <textarea id="question-text" required rows="2" placeholder="책을 읽으며 궁금했던 점이나 친구들과 함께 나누고 싶은 질문을 적어보세요." class="flex-1 p-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm sm:text-base resize-none"></textarea>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-jua px-6 py-3 sm:py-0 rounded-xl shadow-md transition flex items-center justify-center text-base sm:text-lg whitespace-nowrap">
              포스트잇 붙이기 📌
            </button>
          </div>
        </form>
      </div>

      <!-- Filter Bar -->
      <div class="bg-white/90 p-4 rounded-2xl border border-emerald-200 space-y-3">
        <!-- 1) 쪽수 필터 -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1">
          <span class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap">📖 쪽수 필터:</span>
          <button onclick="filterBySection('all')" data-sec="all" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap">전체보기</button>
          <button onclick="filterBySection('section1')" data-sec="section1" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-100 whitespace-nowrap">1) 7~42쪽</button>
          <button onclick="filterBySection('section2')" data-sec="section2" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-amber-100 whitespace-nowrap">2) 43~84쪽</button>
          <button onclick="filterBySection('section3')" data-sec="section3" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-100 whitespace-nowrap">3) 85~107쪽</button>
          <button onclick="filterBySection('section4')" data-sec="section4" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-purple-100 whitespace-nowrap">4) 108~147쪽</button>
          <button onclick="filterBySection('section5')" data-sec="section5" class="sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-rose-100 whitespace-nowrap">5) 148~170쪽</button>
        </div>

        <!-- 2) 질문 유형 필터 -->
        <div class="flex items-center justify-between flex-wrap gap-2 pt-2 border-t border-emerald-100">
          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            <span class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap">🏷️ 유형 필터:</span>
            <button onclick="filterByCategory('all')" data-cat="all" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap">전체유형</button>
            <button onclick="filterByCategory('인물')" data-cat="인물" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-red-100 whitespace-nowrap">🔴 인물의 마음</button>
            <button onclick="filterByCategory('만약에')" data-cat="만약에" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-green-100 whitespace-nowrap">🟢 만약에?</button>
            <button onclick="filterByCategory('현실')" data-cat="현실" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-100 whitespace-nowrap">🔵 현실 세계 연결</button>
            <button onclick="filterByCategory('자유')" data-cat="자유" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-yellow-100 whitespace-nowrap">🟡 자유 질문</button>
          </div>
          <div class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap ml-auto">
            모인 질문 <span id="question-count" class="text-emerald-600 font-mono text-base">0</span>개
          </div>
        </div>
      </div>

      <!-- Question Cards Grid (Post-it Board) -->
      <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamic Post-it Cards -->
      </div>
    </div>

  </main>

  <script>
    // 안심 메모리 스토리지 (localStorage 차단 예외 처리)
    var memStorage = {};
    function setStorageItem(key, val) {
      try {
        localStorage.setItem(key, val);
      } catch (e) {
        memStorage[key] = val;
      }
    }
    function getStorageItem(key) {
      try {
        var v = localStorage.getItem(key);
        if (v !== null) return v;
      } catch (e) {}
      return memStorage[key] || null;
    }
    function removeStorageItem(key) {
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      delete memStorage[key];
    }

    var currentUser = { name: '', role: '', roomCode: '' };
    var currentRoom = { roomTitle: '', bookTitle: '', code: '' };
    var activeSecFilter = 'all';
    var activeCatFilter = 'all';
    var currentCategory = '인물';
    var questions = [];

    var sections = {
      'section1': { name: '1) 7쪽~42쪽', color: 'bg-emerald-200 text-emerald-950 border-emerald-400' },
      'section2': { name: '2) 43쪽~84쪽', color: 'bg-amber-200 text-amber-950 border-amber-400' },
      'section3': { name: '3) 85쪽~107쪽', color: 'bg-blue-200 text-blue-950 border-blue-400' },
      'section4': { name: '4) 108쪽~147쪽', color: 'bg-purple-200 text-purple-950 border-purple-400' },
      'section5': { name: '5) 148쪽~170쪽', color: 'bg-rose-200 text-rose-950 border-rose-400' }
    };

    var categoryStyles = {
      '인물': { tag: '🔴 인물의 마음', class: 'postit-red', topBar: 'bg-red-400', badgeBg: 'bg-red-200 text-red-950 border-red-300' },
      '만약에': { tag: '🟢 만약에?', class: 'postit-green', topBar: 'bg-green-400', badgeBg: 'bg-green-200 text-green-950 border-green-300' },
      '현실': { tag: '🔵 현실 세계 연결', class: 'postit-blue', topBar: 'bg-blue-400', badgeBg: 'bg-blue-200 text-blue-950 border-blue-300' },
      '자유': { tag: '🟡 자유 질문', class: 'postit-yellow', topBar: 'bg-yellow-400', badgeBg: 'bg-yellow-200 text-yellow-950 border-yellow-300' }
    };

    function getRoomData(code) {
      try {
        var direct = getStorageItem('room_data_' + code);
        if (direct) return JSON.parse(direct);

        var registry = getStorageItem('bamboo_all_rooms');
        if (registry) {
          var rooms = JSON.parse(registry);
          if (rooms[code]) return rooms[code];
        }
      } catch (e) {}
      return null;
    }

    function saveRoomData(code, data) {
      try {
        setStorageItem('room_data_' + code, JSON.stringify(data));
        var registry = {};
        var storedRegistry = getStorageItem('bamboo_all_rooms');
        if (storedRegistry) {
          try { registry = JSON.parse(storedRegistry); } catch(e){}
        }
        registry[code] = data;
        setStorageItem('bamboo_all_rooms', JSON.stringify(registry));
      } catch (e) {}
    }

    function initApp() {
      try {
        var savedUser = getStorageItem('bamboo_current_user');
        var savedRoom = getStorageItem('bamboo_current_room');
        
        if (savedUser && savedRoom) {
          currentUser = JSON.parse(savedUser);
          currentRoom = JSON.parse(savedRoom);
          if (currentUser && currentUser.roomCode) {
            loadRoomData();
            return;
          }
        }
      } catch (e) {}
      
      switchTab('student');
    }

    window.onload = function() {
      initApp();
    };

    function switchTab(tab) {
      var authView = document.getElementById('auth-view');
      var boardView = document.getElementById('board-view');
      if (authView) authView.classList.remove('hidden');
      if (boardView) boardView.classList.add('hidden');

      document.getElementById('tab-student').className = tab === 'student' ? 'flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm' : 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700';
      document.getElementById('tab-teacher-create').className = tab === 'teacher-create' ? 'flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm' : 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700';
      document.getElementById('tab-teacher-login').className = tab === 'teacher-login' ? 'flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm' : 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700';

      document.getElementById('student-form').classList.toggle('hidden', tab !== 'student');
      document.getElementById('teacher-create-form').classList.toggle('hidden', tab !== 'teacher-create');
      document.getElementById('teacher-login-form').classList.toggle('hidden', tab !== 'teacher-login');
    }

    function generateCode() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var code = '';
      for(var i=0; i<6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function handleStudentJoin(e) {
      e.preventDefault();
      var name = document.getElementById('student-name').value.trim();
      var code = document.getElementById('student-code').value.trim().toUpperCase();

      var roomInfo = getRoomData(code);
      if (!roomInfo) {
        alert('존재하지 않는 초대코드입니다. 선생님께 코드를 다시 확인해 주세요!');
        return;
      }

      currentUser = { name: name, role: 'student', roomCode: code };
      currentRoom = { roomTitle: roomInfo.roomTitle, bookTitle: roomInfo.bookTitle, code: code };

      setStorageItem('bamboo_current_user', JSON.stringify(currentUser));
      setStorageItem('bamboo_current_room', JSON.stringify(currentRoom));

      loadRoomData();
    }

    function handleTeacherCreate(e) {
      e.preventDefault();
      var roomTitle = document.getElementById('teacher-room').value.trim();
      var bookTitle = document.getElementById('teacher-book').value.trim();
      var name = document.getElementById('teacher-name').value.trim();
      var password = document.getElementById('teacher-password').value.trim();
      var code = generateCode();

      currentUser = { name: name + ' (선생님)', role: 'admin', roomCode: code };
      currentRoom = { roomTitle: roomTitle, bookTitle: bookTitle, code: code };

      saveRoomData(code, { roomTitle: roomTitle, bookTitle: bookTitle, password: password });
      setStorageItem('bamboo_current_user', JSON.stringify(currentUser));
      setStorageItem('bamboo_current_room', JSON.stringify(currentRoom));

      if (!getStorageItem('questions_' + code)) {
        setStorageItem('questions_' + code, JSON.stringify([]));
      }

      loadRoomData();
    }

    function handleTeacherLogin(e) {
      e.preventDefault();
      var code = document.getElementById('login-code').value.trim().toUpperCase();
      var password = document.getElementById('login-password').value.trim();

      var roomInfo = getRoomData(code);
      if (!roomInfo) {
        alert('존재하지 않는 초대코드입니다.');
        return;
      }

      if (roomInfo.password !== password) {
        alert('관리자 비밀번호가 일치하지 않습니다.');
        return;
      }

      currentUser = { name: '선생님 (관리자)', role: 'admin', roomCode: code };
      currentRoom = { roomTitle: roomInfo.roomTitle, bookTitle: roomInfo.bookTitle, code: code };

      setStorageItem('bamboo_current_user', JSON.stringify(currentUser));
      setStorageItem('bamboo_current_room', JSON.stringify(currentRoom));

      loadRoomData();
    }

    function loadRoomData() {
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('board-view').classList.remove('hidden');
      document.getElementById('room-info-bar').classList.remove('hidden');

      document.getElementById('bar-room-title').innerText = currentRoom.roomTitle;
      document.getElementById('bar-book-title').innerText = currentRoom.bookTitle;
      document.getElementById('bar-invite-code').innerText = currentRoom.code;
      document.getElementById('bar-user-badge').innerText = currentUser.role === 'admin' ? '👑 관리자(선생님)' : '학생';

      if (currentUser.role === 'admin') {
        document.getElementById('btn-delete-room').classList.remove('hidden');
      }

      try {
        var storedQ = getStorageItem('questions_' + currentRoom.code);
        questions = storedQ ? JSON.parse(storedQ) : [];
      } catch(e) {
        questions = [];
      }
      renderQuestions();
    }

    function saveAndBroadcast() {
      try {
        setStorageItem('questions_' + currentRoom.code, JSON.stringify(questions));
      } catch (e) {}
    }

    function exitRoom() {
      removeStorageItem('bamboo_current_user');
      removeStorageItem('bamboo_current_room');
      location.reload();
    }

    function deleteEntireRoom() {
      if (confirm('이 독서 대나무숲 방과 모든 질문을 완전히 삭제하시겠습니까?')) {
        removeStorageItem('room_data_' + currentRoom.code);
        removeStorageItem('questions_' + currentRoom.code);
        exitRoom();
      }
    }

    function selectCategory(cat) {
      currentCategory = cat;
      var btns = document.querySelectorAll('.cat-btn');
      btns.forEach(function(btn) {
        if(btn.innerText.includes(cat === '인물' ? '인물' : cat === '만약에' ? '만약에' : cat === '현실' ? '현실' : '자유')) {
          var catClass = cat === '인물' ? 'bg-red-100 text-red-900 border-red-400' : cat === '만약에' ? 'bg-green-100 text-green-900 border-green-400' : cat === '현실' ? 'bg-blue-100 text-blue-900 border-blue-400' : 'bg-yellow-100 text-yellow-900 border-yellow-400';
          btn.className = 'cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold ' + catClass + ' border-2 shadow-xs';
        } else {
          btn.className = 'cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-gray-100';
        }
      });
    }

    // 정확한 매칭을 적용한 쪽수 필터 함수
    function filterBySection(sec) {
      activeSecFilter = sec;
      var btns = document.querySelectorAll('.sec-filter-btn');
      btns.forEach(function(btn) {
        var btnSec = btn.getAttribute('data-sec');
        if (btnSec === sec) {
          btn.className = 'sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap';
        } else {
          btn.className = 'sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-50 whitespace-nowrap';
        }
      });
      renderQuestions();
    }

    // 정확한 매칭을 적용한 유형 필터 함수
    function filterByCategory(cat) {
      activeCatFilter = cat;
      var btns = document.querySelectorAll('.cat-filter-btn');
      btns.forEach(function(btn) {
        var btnCat = btn.getAttribute('data-cat');
        if (btnCat === cat) {
          btn.className = 'cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap';
        } else {
          btn.className = 'cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-50 whitespace-nowrap';
        }
      });
      renderQuestions();
    }

    function handleAddQuestion(e) {
      e.preventDefault();
      var sec = document.getElementById('section-select').value;
      var textInput = document.getElementById('question-text');
      var text = textInput.value.trim();
      if (!text) return;

      var q = {
        id: Date.now() + Math.random(),
        author: currentUser.name,
        sectionKey: sec,
        category: currentCategory,
        text: text,
        time: '방금 전',
        likes: 0,
        likedUsers: [],
        comments: []
      };

      questions.unshift(q);
      saveAndBroadcast();
      renderQuestions();
      textInput.value = '';
    }

    function editQuestion(id) {
      var q = questions.find(function(item) { return item.id === id; });
      if (!q) return;

      var newText = prompt('학생의 질문 내용을 수정해 주세요 (맞춤법/표현 지도):', q.text);
      if (newText !== null && newText.trim() !== '') {
        q.text = newText.trim();
        saveAndBroadcast();
        renderQuestions();
      }
    }

    function deleteQuestion(id) {
      if (confirm('이 질문을 삭제하시겠습니까?')) {
        questions = questions.filter(function(item) { return item.id !== id; });
        saveAndBroadcast();
        renderQuestions();
      }
    }

    function toggleLike(id) {
      var q = questions.find(function(item) { return item.id === id; });
      if(q) {
        if(!q.likedUsers) q.likedUsers = [];
        var idx = q.likedUsers.indexOf(currentUser.name);
        if(idx > -1) {
          q.likedUsers.splice(idx, 1);
          q.likes--;
        } else {
          q.likedUsers.push(currentUser.name);
          q.likes++;
        }
        saveAndBroadcast();
        renderQuestions();
      }
    }

    function addComment(id, event) {
      event.preventDefault();
      var input = document.getElementById('comment-input-' + id);
      var text = input.value.trim();
      if(!text) return;

      var q = questions.find(function(item) { return item.id === id; });
      if(q) {
        q.comments.push({ id: Date.now() + Math.random(), author: currentUser.name, text: text });
        saveAndBroadcast();
        renderQuestions();
      }
    }

    function deleteComment(qId, cId) {
      if (confirm('이 댓글을 삭제하시겠습니까?')) {
        var q = questions.find(function(item) { return item.id === qId; });
        if(q) {
          q.comments = q.comments.filter(function(c) { return c.id !== cId; });
          saveAndBroadcast();
          renderQuestions();
        }
      }
    }

    function renderQuestions() {
      var grid = document.getElementById('questions-grid');
      if (!grid) return;
      
      var filtered = questions.filter(function(q) {
        var secMatch = (activeSecFilter === 'all' || q.sectionKey === activeSecFilter);
        var catMatch = (activeCatFilter === 'all' || q.category === activeCatFilter);
        return secMatch && catMatch;
      });
      
      document.getElementById('question-count').innerText = filtered.length;
      grid.innerHTML = '';

      filtered.forEach(function(q, idx) {
        var secInfo = sections[q.sectionKey] || sections['section1'];
        var catInfo = categoryStyles[q.category] || categoryStyles['자유'];
        var isLiked = q.likedUsers && q.likedUsers.includes(currentUser.name);
        var isAdmin = currentUser.role === 'admin';

        var rotDeg = (idx % 3 === 0 ? -1.2 : idx % 3 === 1 ? 1.2 : -0.5);

        var card = document.createElement('div');
        card.style.transform = 'rotate(' + rotDeg + 'deg)';
        card.className = 'postit-card ' + catInfo.class + ' border-2 rounded-2xl overflow-hidden flex flex-col justify-between relative';
        
        var commentsHtml = q.comments.map(function(c) {
          return '<div class="text-xs sm:text-sm bg-white/90 p-2 rounded-lg border border-gray-200/80 flex justify-between items-center shadow-2xs">' +
            '<div class="keep-all"><span class="font-bold text-emerald-900">' + c.author + ':</span> <span class="text-gray-800">' + c.text + '</span></div>' +
            (isAdmin ? '<button onclick="deleteComment(' + q.id + ', ' + c.id + ')" class="text-red-500 hover:text-red-700 text-xs ml-1 font-bold">×</button>' : '') +
          '</div>';
        }).join('');

        if (q.comments.length === 0) {
          commentsHtml = '<p class="text-xs sm:text-sm text-gray-400 text-center py-1">첫 댓글을 남겨보세요!</p>';
        }

        card.innerHTML = 
          '<div class="' + catInfo.topBar + ' h-2.5 w-full opacity-80"></div>' +
          '<div class="p-5 pt-3">' +
            '<div class="flex flex-wrap justify-between items-center gap-1 mb-2">' +
              '<div class="flex flex-wrap gap-1 items-center">' +
                '<span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full ' + secInfo.color + ' border truncate">' + secInfo.name + '</span>' +
                '<span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full ' + catInfo.badgeBg + ' border truncate">' + catInfo.tag + '</span>' +
              '</div>' +
              '<div class="flex items-center gap-1">' +
                (isAdmin ? '<button onclick="editQuestion(' + q.id + ')" class="text-sm text-blue-700 hover:text-blue-900 font-bold px-1" title="질문 수정">✏️</button>' +
                           '<button onclick="deleteQuestion(' + q.id + ')" class="text-sm text-red-600 hover:text-red-800 font-bold px-1" title="질문 삭제">🗑️</button>' : '') +
              '</div>' +
            '</div>' +
            '<p class="text-gray-900 text-base sm:text-lg font-medium leading-relaxed my-3 whitespace-pre-wrap keep-all">"' + q.text + '"</p>' +
          '</div>' +
          '<div class="p-5 pt-0">' +
            '<div class="flex justify-between items-center text-xs sm:text-sm text-gray-600 pt-2 border-t border-black/10 mb-3">' +
              '<span class="font-bold text-gray-900">✍️ ' + q.author + '</span>' +
              '<button onclick="toggleLike(' + q.id + ')" class="flex items-center gap-1 font-bold ' + (isLiked ? 'text-red-600' : 'text-gray-500 hover:text-red-500') + ' transition">' +
                '<i class="' + (isLiked ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i>' +
                '<span>공감 ' + q.likes + '</span>' +
              '</button>' +
            '</div>' +
            '<div class="space-y-2 bg-white/70 rounded-xl p-2.5 border border-black/5">' +
              '<div class="space-y-1.5 max-h-36 overflow-y-auto pr-1">' + commentsHtml + '</div>' +
              '<form onsubmit="addComment(' + q.id + ', event)" class="flex gap-1 mt-2">' +
                '<input type="text" id="comment-input-' + q.id + '" placeholder="댓글 작성..." class="flex-1 px-2.5 py-1.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white">' +
                '<button type="submit" class="bg-emerald-700 text-white text-xs sm:text-sm px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-800 whitespace-nowrap shadow-xs">등록</button>' +
              '</form>' +
            '</div>' +
          '</div>';

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
