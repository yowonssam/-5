<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>독서 대나무숲 - 함께 나누는 독서 질문 공간</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f2f7f4;
      word-break: keep-all; /* 외톨이 글자 방지 */
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .bamboo-bg {
      background-color: #e2efe8;
      background-image: radial-gradient(#2d6a4f 0.5px, transparent 0.5px), radial-gradient(#2d6a4f 0.5px, #e2efe8 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .keep-all {
      word-break: keep-all;
    }

    /* 파스텔 포스트잇 메모지 스타일 */
    .postit-card {
      box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      border-bottom-right-radius: 18px 4px;
      transition: all 0.2s ease-in-out;
    }
    .postit-card:hover {
      transform: translateY(-4px) rotate(0deg) scale(1.01) !important;
      box-shadow: 6px 12px 20px rgba(0, 0, 0, 0.12);
    }
    .postit-red { background-color: #ffe8e8; border-color: #fca5a5; }
    .postit-green { background-color: #eafaf1; border-color: #86efac; }
    .postit-blue { background-color: #eef7ff; border-color: #93c5fd; }
    .postit-yellow { background-color: #fffde7; border-color: #fde047; }
  </style>
</head>
<body class="bamboo-bg min-h-screen text-gray-800 flex flex-col text-base">

  <!-- Header -->
  <header class="bg-emerald-800 text-white shadow-lg py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎋</span>
        <div>
          <h1 class="text-2xl sm:text-3xl font-jua tracking-wide">독서 대나무숲</h1>
          <p class="text-xs sm:text-sm text-emerald-200">생각을 자유롭게 털어놓는 우리들의 독서 질문 공간</p>
        </div>
      </div>
      <div id="room-info-bar" class="hidden flex flex-wrap items-center justify-center gap-3 bg-emerald-900/80 px-4 py-2 rounded-xl border border-emerald-600">
        <div class="text-sm sm:text-base">
          <span class="text-emerald-300 font-bold">참가자:</span>
          <span class="text-white font-semibold" id="bar-user-badge">닉네임</span>
        </div>
        <button type="button" id="btn-admin-toggle" onclick="toggleAdminMode()" class="text-xs sm:text-sm bg-amber-500 hover:bg-amber-600 px-3 py-1 rounded text-emerald-950 transition font-bold cursor-pointer shadow">
          <i class="fa-solid fa-lock mr-1" id="admin-icon"></i><span id="admin-btn-text">관리자 모드</span>
        </button>
        <button type="button" onclick="exitRoom()" class="text-xs sm:text-sm bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white transition font-bold cursor-pointer">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>닉네임 변경
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">

    <!-- AUTH VIEW (닉네임 입력) -->
    <div id="auth-view" class="max-w-md mx-auto my-12 bg-white/95 backdrop-blur-sm rounded-3xl p-8 shadow-xl border-2 border-emerald-200">
      <div class="text-center mb-8">
        <span class="text-6xl inline-block mb-2">🎋</span>
        <h2 class="text-2xl sm:text-3xl font-jua text-emerald-900">독서 대나무숲 입장하기</h2>
        <p class="text-sm sm:text-base text-gray-500 mt-1">질문으로 깊어지는 생각의 숲</p>
      </div>

      <form id="student-form" class="space-y-5">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-2">본인의 이름 또는 닉네임을 입력해 주세요</label>
          <input type="text" id="student-name" required placeholder="예: 5학년 김독서" class="w-full px-4 py-3.5 rounded-xl border border-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-base">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition cursor-pointer">
          대나무숲 들어가기 🎋
        </button>
      </form>
    </div>

    <!-- BOARD VIEW -->
    <div id="board-view" class="hidden space-y-6">

      <!-- Question Input Form Box -->
      <div class="bg-white/95 rounded-2xl p-5 sm:p-6 shadow-lg border border-emerald-200">
        <h3 class="text-base sm:text-lg font-jua text-emerald-900 mb-3 flex items-center gap-2">
          <span>✍️</span> 읽은 단원(쪽수)과 질문 유형을 선택하고 독서 질문을 포스트잇으로 붙여보세요!
        </h3>
        <form id="question-form" class="space-y-4">
          
          <!-- Section Selector Dropdown -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">📖 질문할 책의 부분 선택:</label>
            <select id="section-select" required class="w-full p-3 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-950 font-bold text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="section1">1) 깨진 삼각형, 새사람, 센터, 북소리, 대숲1 (7쪽~42쪽)</option>
              <option value="section2">2) 사고, 밍밍한 망고, 목격자, 신발장, 대숲2 (43쪽~84쪽)</option>
              <option value="section3">3) 그늘 속으로, 진흙탕 (85쪽~107쪽)</option>
              <option value="section4">4) 흉터의 의미, 내가 만든 가시, 대숲3, 떨리는 손, 남겨 둔 것 (108쪽~147쪽)</option>
              <option value="section5">5) 새잎, 햇빛 (148쪽~170쪽)</option>
            </select>
          </div>

          <!-- Pastel Question Category Buttons -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1.5">🏷️ 질문 유형 (포스트잇 색상 선택):</label>
            <div class="flex flex-wrap gap-2">
              <button type="button" data-cat-btn="인물" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-red-100 text-red-900 border-2 border-red-400 shadow-xs cursor-pointer">🔴 인물의 마음 질문 (분홍)</button>
              <button type="button" data-cat-btn="만약에" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-green-50 cursor-pointer">🟢 만약에? 질문 (연두)</button>
              <button type="button" data-cat-btn="현실" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-blue-50 cursor-pointer">🔵 현실 세계 연결 (하늘)</button>
              <button type="button" data-cat-btn="자유" class="cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-yellow-50 cursor-pointer">🟡 자유 질문 (노랑)</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2 pt-1">
            <textarea id="question-text" required rows="2" placeholder="책을 읽
