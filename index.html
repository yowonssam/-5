<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>독서 대나무숲 - 함께 나누는 독서 질문 공간</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f2f7f4;
      word-break: keep-all; /* 외톨이 글자 방지 */
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .bamboo-bg {
      background-color: #e2efe8;
      background-image: radial-gradient(#2d6a4f 0.5px, transparent 0.5px), radial-gradient(#2d6a4f 0.5px, #e2efe8 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .keep-all {
      word-break: keep-all;
    }

    /* 포스트잇 메모지 스타일 */
    .postit-card {
      box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      border-bottom-right-radius: 18px 4px;
      transition: all 0.2s ease-in-out;
    }
    .postit-card:hover {
      transform: translateY(-4px) rotate(0deg) scale(1.01) !important;
      box-shadow: 6px 12px 20px rgba(0, 0, 0, 0.12);
    }
    .postit-red { background-color: #ffe8e8; border-color: #fca5a5; }
    .postit-green { background-color: #eafaf1; border-color: #86efac; }
    .postit-blue { background-color: #eef7ff; border-color: #93c5fd; }
    .postit-yellow { background-color: #fffde7; border-color: #fde047; }
  </style>
</head>
<body class="bamboo-bg min-h-screen text-gray-800 flex flex-col text-base">

  <!-- Header -->
  <header class="bg-emerald-800 text-white shadow-lg py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎋</span>
        <div>
          <h1 class="text-2xl sm:text-3xl font-jua tracking-wide">독서 대나무숲</h1>
          <p class="text-xs sm:text-sm text-emerald-200">생각을 자유롭게 털어놓는 우리들의 독서 질문 공간</p>
        </div>
      </div>
      <div id="room-info-bar" class="hidden flex flex-wrap items-center justify-center gap-3 bg-emerald-900/80 px-4 py-2 rounded-xl border border-emerald-600">
        <div class="text-sm sm:text-base">
          <span class="text-emerald-300 font-bold" id="bar-book-title">도서명</span>
          <span class="mx-1 text-emerald-400">|</span>
          <span class="text-white font-semibold" id="bar-room-title">방 제목</span>
          <span class="ml-2 text-xs sm:text-sm bg-emerald-700 px-2 py-0.5 rounded text-emerald-200 font-bold" id="bar-user-badge">역할</span>
        </div>
        <div class="bg-amber-400 text-emerald-950 px-3 py-1 rounded-lg font-bold text-sm sm:text-base shadow">
          초대코드: <span id="bar-invite-code" class="tracking-widest font-mono text-base sm:text-lg">------</span>
        </div>
        <button id="btn-delete-room" onclick="deleteEntireRoom()" class="hidden text-xs sm:text-sm bg-red-700 hover:bg-red-800 px-3 py-1 rounded text-white transition font-bold">
          <i class="fa-solid fa-trash mr-1"></i>방 삭제
        </button>
        <button onclick="exitRoom()" class="text-xs sm:text-sm bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white transition font-bold">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>나가기
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">

    <!-- AUTH VIEW -->
    <div id="auth-view" class="max-w-md mx-auto my-10 bg-white/95 backdrop-blur-sm rounded-3xl p-8 shadow-xl border-2 border-emerald-200">
      <div class="text-center mb-8">
        <span class="text-6xl inline-block mb-2">🎍</span>
        <h2 class="text-2xl sm:text-3xl font-jua text-emerald-900">독서 대나무숲 입장하기</h2>
        <p class="text-sm sm:text-base text-gray-500 mt-1">질문으로 깊어지는 생각의 숲</p>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="flex bg-emerald-100 p-1.5 rounded-2xl mb-6">
        <button id="tab-student" onclick="switchTab('student')" class="flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm">
          👨‍🎓 학생 입장
        </button>
        <button id="tab-teacher-create" onclick="switchTab('teacher-create')" class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900">
          👩‍🏫 방 개설
        </button>
        <button id="tab-teacher-login" onclick="switchTab('teacher-login')" class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900">
          🔑 관리자 재입장
        </button>
      </div>

      <!-- Student Form -->
      <form id="student-form" onsubmit="handleStudentJoin(event)" class="space-y-4">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">이름 또는 닉네임</label>
          <input type="text" id="student-name" required placeholder="예: 5학년 김독서" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">선생님이 알려주신 6자리 초대코드</label>
          <input type="text" id="student-code" required maxlength="6" placeholder="예: B9A2K7" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-base sm:text-lg font-mono tracking-widest uppercase">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition">
          대나무숲 들어가기 🎋
        </button>
      </form>

      <!-- Teacher Create Form -->
      <form id="teacher-create-form" onsubmit="handleTeacherCreate(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">방 제목 (학급명)</label>
          <input type="text" id="teacher-room" required placeholder="예: 5학년 2반 독서 대나무숲" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">함께 읽는 책 제목</label>
          <input type="text" id="teacher-book" required placeholder="예: 수남이의 편지" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">선생님 성함</label>
          <input type="text" id="teacher-name" required placeholder="예: 박선생님" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">관리자 비밀번호 (4자리 숫자)</label>
          <input type="password" id="teacher-password" required maxlength="4" placeholder="예: 1234" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base font-mono">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition">
          새 대나무숲 열기 ✨
        </button>
      </form>

      <!-- Teacher Admin Login Form -->
      <form id="teacher-login-form" onsubmit="handleTeacherLogin(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">방 초대코드 (6자리)</label>
          <input type="text" id="login-code" required maxlength="6" placeholder="예: B9A2K7" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-base sm:text-lg font-mono tracking-widest uppercase">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-emerald-800 mb-1">관리자 비밀번호 (4자리)</label>
          <input type="password" id="login-password" required maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none text-sm sm:text-base font-mono">
        </div>
        <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-jua py-3.5 rounded-xl text-lg sm:text-xl shadow-md transition">
          관리자 권한으로 입장 🔑
        </button>
      </form>
    </div>

    <!-- BOARD VIEW -->
    <div id="board-view" class="hidden space-y-6">

      <!-- Question Input Form Box -->
      <div class="bg-white/95 rounded-2xl p-5 sm:p-6 shadow-lg border border-emerald-200">
        <h3 class="text-base sm:text-lg font-jua text-emerald-900 mb-3 flex items-center gap-2">
          <span>✍️</span> 읽은 단원(쪽수)과 질문 유형을 선택하고 독서 질문을 포스트잇으로 붙여보세요!
        </h3>
        <form on
