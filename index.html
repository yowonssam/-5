<head>

  <style>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, 
      collection, query, onSnapshot, getDocs 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase configuration with environment fallback
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDemoConfigForTestingOnly12345678",
          authDomain: "demo-bamboo-app.firebaseapp.com",
          projectId: "demo-bamboo-app",
          storageBucket: "demo-bamboo-app.appspot.com",
          messagingSenderId: "1234567890",
          appId: "1:1234567890:web:abcdef123456"
        };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'bamboo-reading-app';

    let app, auth, db;
    let currentUserAuth = null;
    let questionsUnsubscribe = null;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);

      // Authenticate
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
      } else {
        signInAnonymously(auth);
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUserAuth = user;
          window.fbInitialized = true;
          console.log("Firebase initialized successfully with user UID:", user.uid);
        }
      });
    } catch (e) {
      console.warn("Firebase failed to initialize, falling back to local simulation mode:", e);
      window.fbInitialized = false;
    }

    // Helper paths using system requirements
    function getRoomDocRef(roomCode) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'bamboo_rooms', roomCode);
    }

    function getQuestionsCollectionRef(roomCode) {
      return collection(db, 'artifacts', appId, 'public', 'data', 'bamboo_rooms', roomCode, 'questions');
    }

    function getQuestionDocRef(roomCode, questionId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'bamboo_rooms', roomCode, 'questions', questionId);
    }

    // Global Firebase Operations accessible from regular JS
    window.fbOps = {
      isReady: () => !!currentUserAuth,

      createRoom: async (code, roomTitle, bookTitle, password) => {
        if (!currentUserAuth) throw new Error("Auth not ready");
        const roomRef = getRoomDocRef(code);
        const roomData = {
          code: code,
          roomTitle: roomTitle,
          bookTitle: bookTitle,
          password: password,
          createdAt: new Date().toISOString()
        };
        await setDoc(roomRef, roomData);
        return roomData;
      },

      getRoom: async (code) => {
        if (!currentUserAuth) return null;
        const roomRef = getRoomDocRef(code);
        const snap = await getDoc(roomRef);
        return snap.exists() ? snap.data() : null;
      },

      deleteRoom: async (code) => {
        if (!currentUserAuth) return;
        // Delete questions first
        const qCol = getQuestionsCollectionRef(code);
        const qSnap = await getDocs(qCol);
        const deletePromises = qSnap.docs.map(d => deleteDoc(d.ref));
        await Promise.all(deletePromises);
        // Delete room
        await deleteDoc(getRoomDocRef(code));
      },

      subscribeQuestions: (code, onUpdate, onError) => {
        if (!currentUserAuth) return () => {};
        if (questionsUnsubscribe) questionsUnsubscribe();

        const qCol = getQuestionsCollectionRef(code);
        questionsUnsubscribe = onSnapshot(qCol, (snapshot) => {
          const list = [];
          snapshot.forEach((docSnap) => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });
          // Memory sort by createdAt descending
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          onUpdate(list);
        }, (err) => {
          console.error("Firestore subscription error:", err);
          if (onError) onError(err);
        });

        return questionsUnsubscribe;
      },

      addQuestion: async (code, questionData) => {
        if (!currentUserAuth) return;
        const qId = 'q_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const qRef = getQuestionDocRef(code, qId);
        await setDoc(qRef, {
          ...questionData,
          createdAt: Date.now()
        });
      },

      updateQuestionText: async (code, qId, newText) => {
        if (!currentUserAuth) return;
        const qRef = getQuestionDocRef(code, qId);
        await updateDoc(qRef, { text: newText });
      },

      deleteQuestion: async (code, qId) => {
        if (!currentUserAuth) return;
        const qRef = getQuestionDocRef(code, qId);
        await deleteDoc(qRef);
      },

      toggleLike: async (code, qId, userName) => {
        if (!currentUserAuth) return;
        const qRef = getQuestionDocRef(code, qId);
        const snap = await getDoc(qRef);
        if (!snap.exists()) return;
        const data = snap.data();
        let likedUsers = data.likedUsers || [];
        let likes = data.likes || 0;

        const idx = likedUsers.indexOf(userName);
        if (idx > -1) {
          likedUsers.splice(idx, 1);
          likes = Math.max(0, likes - 1);
        } else {
          likedUsers.push(userName);
          likes++;
        }

        await updateDoc(qRef, { likedUsers, likes });
      },

      addComment: async (code, qId, author, text) => {
        if (!currentUserAuth) return;
        const qRef = getQuestionDocRef(code, qId);
        const snap = await getDoc(qRef);
        if (!snap.exists()) return;
        const data = snap.data();
        const comments = data.comments || [];
        comments.push({
          id: 'c_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          author: author,
          text: text
        });
        await updateDoc(qRef, { comments });
      },

      deleteComment: async (code, qId, cId) => {
        if (!currentUserAuth) return;
        const qRef = getQuestionDocRef(code, qId);
        const snap = await getDoc(qRef);
        if (!snap.exists()) return;
        const data = snap.data();
        const comments = (data.comments || []).filter(c => c.id !== cId);
        await updateDoc(qRef, { comments });
      }
    };
  </script>
</head>
<body class="bamboo-bg min-h-screen text-gray-800 flex flex-col text-base">

  <!-- Header -->

        <button onclick="exitRoom()" class="text-xs sm:text-sm bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white transition font-bold cursor-pointer">

        <span class="text-6xl inline-block mb-2">🎍</span>
        <h2 class="text-2xl sm:text-3xl font-jua text-emerald-900">독서 대나무숲 입장하기</h2>
        <p class="text-sm sm:text-base text-gray-500 mt-1">질문으로 깊어지는 생각의 숲</p>
      </div>

      <!-- Mode Selector Tabs -->

        <button type="button" id="tab-teacher-create" onclick="switchTab('teacher-create')" class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900 cursor-pointer">

        <div>

      <!-- Question Input Form Box -->

        </div>

        <!-- 2) 질문 유형 필터 -->

          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            <span class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap">🏷️ 유형 필터:</span>
            <button onclick="filterByCategory('all')" data-cat="all" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer">전체유형</button>
            <button onclick="filterByCategory('인물')" data-cat="인물" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-red-100 whitespace-nowrap cursor-pointer">🔴 인물의 마음</button>
            <button onclick="filterByCategory('만약에')" data-cat="만약에" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-green-100 whitespace-nowrap cursor-pointer">🟢 만약에?</button>
            <button onclick="filterByCategory('현실')" data-cat="현실" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-100 whitespace-nowrap cursor-pointer">🔵 현실 세계 연결</button>
            <button onclick="filterByCategory('자유')" data-cat="자유" class="cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-yellow-100 whitespace-nowrap cursor-pointer">🟡 자유 질문</button>
          </div>
          <div class="text-xs sm:text-sm font-bold text-emerald-900 whitespace-nowrap ml-auto">
            모인 질문 <span id="question-count" class="text-emerald-600 font-mono text-base">0</span>개
          </div>
        </div>
      </div>

      <!-- Question Cards Grid (Post-it Board) -->
      <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamic Post-it Cards -->
      </div>
    </div>

  </main>

  <script>
    // Storage helpers with tab-isolation fallback
    var memStorage = {};

    function setSessionItem(key, val) {
      try { sessionStorage.setItem(key, val); } catch (e) { memStorage[key] = val; }
    }
    function getSessionItem(key) {
      try {
        var v = sessionStorage.getItem(key);
        if (v !== null) return v;
      } catch (e) {}
      return memStorage[key] || null;
    }
    function removeSessionItem(key) {
      try { sessionStorage.removeItem(key); } catch (e) {}
      delete memStorage[key];
    }

    var currentUser = { name: '', role: '', roomCode: '' };
    var currentRoom = { roomTitle: '', bookTitle: '', code: '' };
    var activeSecFilter = 'all';
    var activeCatFilter = 'all';
    var currentCategory = '인물';
    var questions = [];

    var sections = {
      'section1': { name: '1) 7쪽~42쪽', color: 'bg-emerald-200 text-emerald-950 border-emerald-400' },
      'section2': { name: '2) 43쪽~84쪽', color: 'bg-amber-200 text-amber-950 border-amber-400' },
      'section3': { name: '3) 85쪽~107쪽', color: 'bg-blue-200 text-blue-950 border-blue-400' },
      'section4': { name: '4) 108쪽~147쪽', color: 'bg-purple-200 text-purple-950 border-purple-400' },
      'section5': { name: '5) 148쪽~170쪽', color: 'bg-rose-200 text-rose-950 border-rose-400' }
    };

    var categoryStyles = {
      '인물': { tag: '🔴 인물의 마음', class: 'postit-red', topBar: 'bg-red-400', badgeBg: 'bg-red-200 text-red-950 border-red-300' },
      '만약에': { tag: '🟢 만약에?', class: 'postit-green', topBar: 'bg-green-400', badgeBg: 'bg-green-200 text-green-950 border-green-300' },
      '현실': { tag: '🔵 현실 세계 연결', class: 'postit-blue', topBar: 'bg-blue-400', badgeBg: 'bg-blue-200 text-blue-950 border-blue-300' },
      '자유': { tag: '🟡 자유 질문', class: 'postit-yellow', topBar: 'bg-yellow-400', badgeBg: 'bg-yellow-200 text-yellow-950 border-yellow-300' }
    };

    function waitForFirebase(maxMs = 3000) {
      return new Promise((resolve) => {
        const start = Date.now();
        const interval = setInterval(() => {
          if (window.fbOps && window.fbOps.isReady()) {
            clearInterval(interval);
            resolve(true);
          } else if (Date.now() - start > maxMs) {
            clearInterval(interval);
            resolve(false);
          }
        }, 100);
      });
    }

    async function initApp() {
      await waitForFirebase();

      try {
        var savedUser = getSessionItem('bamboo_current_user');
        var savedRoom = getSessionItem('bamboo_current_room');
        
        if (savedUser && savedRoom) {
          currentUser = JSON.parse(savedUser);
          currentRoom = JSON.parse(savedRoom);
          if (currentUser && currentUser.roomCode) {
            loadRoomData();
            return;
          }
        }
      } catch (e) {}
      
      switchTab('student');
    }

    window.onload = function() {
      initApp();
    };

    function switchTab(tab) {
      var studentForm = document.getElementById('student-form');
      var teacherCreateForm = document.getElementById('teacher-create-form');
      var teacherLoginForm = document.getElementById('teacher-login-form');

      var tabStudent = document.getElementById('tab-student');
      var tabTeacherCreate = document.getElementById('tab-teacher-create');
      var tabTeacherLogin = document.getElementById('tab-teacher-login');

      if (studentForm) studentForm.classList.toggle('hidden', tab !== 'student');
      if (teacherCreateForm) teacherCreateForm.classList.toggle('hidden', tab !== 'teacher-create');
      if (teacherLoginForm) teacherLoginForm.classList.toggle('hidden', tab !== 'teacher-login');

      if (tabStudent) tabStudent.className = tab === 'student' ? 'flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm cursor-pointer' : 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900 cursor-pointer';
      if (tabTeacherCreate) tabTeacherCreate.className = tab === 'teacher-create' ? 'flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm cursor-pointer' : 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900 cursor-pointer';
      if (tabTeacherLogin) tabTeacherLogin.className = tab === 'teacher-login' ? 'flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base transition bg-white text-emerald-800 shadow-sm cursor-pointer' : 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition text-emerald-700 hover:text-emerald-900 cursor-pointer';
    }

    function generateCode() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var code = '';
      for(var i=0; i<6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    async function handleStudentJoin(e) {
      e.preventDefault();
      var name = document.getElementById('student-name').value.trim();
      var code = document.getElementById('student-code').value.trim().toUpperCase();

      await waitForFirebase();

      try {
        var roomInfo = await window.fbOps.getRoom(code);
        if (!roomInfo) {
          alert('존재하지 않는 초대코드입니다. 선생님께 코드를 다시 확인해 주세요!');
          return;
        }

        currentUser = { name: name, role: 'student', roomCode: code };
        currentRoom = { roomTitle: roomInfo.roomTitle, bookTitle: roomInfo.bookTitle, code: code };

        setSessionItem('bamboo_current_user', JSON.stringify(currentUser));
        setSessionItem('bamboo_current_room', JSON.stringify(currentRoom));

        loadRoomData();
      } catch (err) {
        alert('서버 연결 중 오류가 발생했습니다. 다시 시도해 주세요.');
      }
    }

    async function handleTeacherCreate(e) {
      e.preventDefault();
      var roomTitle = document.getElementById('teacher-room').value.trim();
      var bookTitle = document.getElementById('teacher-book').value.trim();
      var name = document.getElementById('teacher-name').value.trim();
      var password = document.getElementById('teacher-password').value.trim();
      var code = generateCode();

      await waitForFirebase();

      try {
        await window.fbOps.createRoom(code, roomTitle, bookTitle, password);

        currentUser = { name: name + ' (선생님)', role: 'admin', roomCode: code };
        currentRoom = { roomTitle: roomTitle, bookTitle: bookTitle, code: code };

        setSessionItem('bamboo_current_user', JSON.stringify(currentUser));
        setSessionItem('bamboo_current_room', JSON.stringify(currentRoom));

        loadRoomData();
      } catch (err) {
        alert('방 생성 실패: 네트워크 연결을 확인하세요.');
      }
    }

    async function handleTeacherLogin(e) {
      e.preventDefault();
      var code = document.getElementById('login-code').value.trim().toUpperCase();
      var password = document.getElementById('login-password').value.trim();

      await waitForFirebase();

      try {
        var roomInfo = await window.fbOps.getRoom(code);
        if (!roomInfo) {
          alert('존재하지 않는 초대코드입니다.');
          return;
        }

        if (roomInfo.password !== password) {
          alert('관리자 비밀번호가 일치하지 않습니다.');
          return;
        }

        currentUser = { name: '선생님 (관리자)', role: 'admin', roomCode: code };
        currentRoom = { roomTitle: roomInfo.roomTitle, bookTitle: roomInfo.bookTitle, code: code };

        setSessionItem('bamboo_current_user', JSON.stringify(currentUser));
        setSessionItem('bamboo_current_room', JSON.stringify(currentRoom));

        loadRoomData();
      } catch (err) {
        alert('로그인 실패: 다시 시도해 주세요.');
      }
    }

    function loadRoomData() {
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('board-view').classList.remove('hidden');
      document.getElementById('room-info-bar').classList.remove('hidden');

      document.getElementById('bar-room-title').innerText = currentRoom.roomTitle;
      document.getElementById('bar-book-title').innerText = currentRoom.bookTitle;
      document.getElementById('bar-invite-code').innerText = currentRoom.code;
      document.getElementById('bar-user-badge').innerText = currentUser.role === 'admin' ? '👑 관리자(선생님)' : '학생';

      if (currentUser.role === 'admin') {
        document.getElementById('btn-delete-room').classList.remove('hidden');
      }

      // Realtime subscription for Questions
      window.fbOps.subscribeQuestions(currentRoom.code, (updatedQuestions) => {
        questions = updatedQuestions;
        renderQuestions();
      }, (err) => {
        console.error("실시간 동기화 오류:", err);
      });
    }

    function exitRoom() {
      removeSessionItem('bamboo_current_user');
      removeSessionItem('bamboo_current_room');
      location.reload();
    }

    async function deleteEntireRoom() {
      if (confirm('이 독서 대나무숲 방과 모든 질문을 완전히 삭제하시겠습니까? 다른 기기에서도 데이터가 삭제됩니다.')) {
        await window.fbOps.deleteRoom(currentRoom.code);
        exitRoom();
      }
    }

    function selectCategory(cat) {
      currentCategory = cat;
      var btns = document.querySelectorAll('.cat-btn');
      btns.forEach(function(btn) {
        if(btn.innerText.includes(cat === '인물' ? '인물' : cat === '만약에' ? '만약에' : cat === '현실' ? '현실' : '자유')) {
          var catClass = cat === '인물' ? 'bg-red-100 text-red-900 border-red-400' : cat === '만약에' ? 'bg-green-100 text-green-900 border-green-400' : cat === '현실' ? 'bg-blue-100 text-blue-900 border-blue-400' : 'bg-yellow-100 text-yellow-900 border-yellow-400';
          btn.className = 'cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold ' + catClass + ' border-2 shadow-xs cursor-pointer';
        } else {
          btn.className = 'cat-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-gray-50 text-gray-700 border-2 border-transparent hover:bg-gray-100 cursor-pointer';
        }
      });
    }

    function filterBySection(sec) {
      activeSecFilter = sec;
      var btns = document.querySelectorAll('.sec-filter-btn');
      btns.forEach(function(btn) {
        var btnSec = btn.getAttribute('data-sec');
        if (btnSec === sec) {
          btn.className = 'sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer';
        } else {
          btn.className = 'sec-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-50 whitespace-nowrap cursor-pointer';
        }
      });
      renderQuestions();
    }

    function filterByCategory(cat) {
      activeCatFilter = cat;
      var btns = document.querySelectorAll('.cat-filter-btn');
      btns.forEach(function(btn) {
        var btnCat = btn.getAttribute('data-cat');
        if (btnCat === cat) {
          btn.className = 'cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-emerald-800 text-white whitespace-nowrap cursor-pointer';
        } else {
          btn.className = 'cat-filter-btn text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-emerald-50 whitespace-nowrap cursor-pointer';
        }
      });
      renderQuestions();
    }

    async function handleAddQuestion(e) {
      e.preventDefault();
      var sec = document.getElementById('section-select').value;
      var textInput = document.getElementById('question-text');
      var text = textInput.value.trim();
      if (!text) return;

      var qData = {
        author: currentUser.name,
        sectionKey: sec,
        category: currentCategory,
        text: text,
        likes: 0,
        likedUsers: [],
        comments: []
      };

      await window.fbOps.addQuestion(currentRoom.code, qData);
      textInput.value = '';
    }

    async function editQuestion(id) {
      var q = questions.find(function(item) { return item.id === id; });
      if (!q) return;

      var newText = prompt('학생의 질문 내용을 수정해 주세요 (맞춤법/표현 지도):', q.text);
      if (newText !== null && newText.trim() !== '') {
        await window.fbOps.updateQuestionText(currentRoom.code, id, newText.trim());
      }
    }

    async function deleteQuestion(id) {
      if (confirm('이 질문을 삭제하시겠습니까?')) {
        await window.fbOps.deleteQuestion(currentRoom.code, id);
      }
    }

    async function toggleLike(id) {
      await window.fbOps.toggleLike(currentRoom.code, id, currentUser.name);
    }

    async function addComment(id, event) {
      event.preventDefault();
      var input = document.getElementById('comment-input-' + id);
      var text = input.value.trim();
      if(!text) return;

      await window.fbOps.addComment(currentRoom.code, id, currentUser.name, text);
      input.value = '';
    }

    async function deleteComment(qId, cId) {
      if (confirm('이 댓글을 삭제하시겠습니까?')) {
        await window.fbOps.deleteComment(currentRoom.code, qId, cId);
      }
    }

    function renderQuestions() {
      var grid = document.getElementById('questions-grid');
      if (!grid) return;
      
      var filtered = questions.filter(function(q) {
        var secMatch = (activeSecFilter === 'all' || q.sectionKey === activeSecFilter);
        var catMatch = (activeCatFilter === 'all' || q.category === activeCatFilter);
        return secMatch && catMatch;
      });
      
      document.getElementById('question-count').innerText = filtered.length;
      grid.innerHTML = '';

      filtered.forEach(function(q, idx) {
        var secInfo = sections[q.sectionKey] || sections['section1'];
        var catInfo = categoryStyles[q.category] || categoryStyles['자유'];
        var isLiked = q.likedUsers && q.likedUsers.includes(currentUser.name);
        var isAdmin = currentUser.role === 'admin';

        var rotDeg = (idx % 3 === 0 ? -1.2 : idx % 3 === 1 ? 1.2 : -0.5);

        var card = document.createElement('div');
        card.style.transform = 'rotate(' + rotDeg + 'deg)';
        card.className = 'postit-card ' + catInfo.class + ' border-2 rounded-2xl overflow-hidden flex flex-col justify-between relative';
        
        var comments = q.comments || [];
        var commentsHtml = comments.map(function(c) {
          return '<div class="text-xs sm:text-sm bg-white/90 p-2 rounded-lg border border-gray-200/80 flex justify-between items-center shadow-2xs">' +
            '<div class="keep-all"><span class="font-bold text-emerald-900">' + c.author + ':</span> <span class="text-gray-800">' + c.text + '</span></div>' +
            (isAdmin ? '<button onclick="deleteComment(\'' + q.id + '\', \'' + c.id + '\')" class="text-red-500 hover:text-red-700 text-xs ml-1 font-bold cursor-pointer">×</button>' : '') +
          '</div>';
        }).join('');

        if (comments.length === 0) {
          commentsHtml = '<p class="text-xs sm:text-sm text-gray-400 text-center py-1">첫 댓글을 남겨보세요!</p>';
        }

        card.innerHTML = 
          '<div class="' + catInfo.topBar + ' h-2.5 w-full opacity-80"></div>' +
          '<div class="p-5 pt-3">' +
            '<div class="flex flex-wrap justify-between items-center gap-1 mb-2">' +
              '<div class="flex flex-wrap gap-1 items-center">' +
                '<span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full ' + secInfo.color + ' border truncate">' + secInfo.name + '</span>' +
                '<span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full ' + catInfo.badgeBg + ' border truncate">' + catInfo.tag + '</span>' +
              '</div>' +
              '<div class="flex items-center gap-1">' +
                (isAdmin ? '<button onclick="editQuestion(\'' + q.id + '\')" class="text-sm text-blue-700 hover:text-blue-900 font-bold px-1 cursor-pointer" title="질문 수정">✏️</button>' +
                           '<button onclick="deleteQuestion(\'' + q.id + '\')" class="text-sm text-red-600 hover:text-red-800 font-bold px-1 cursor-pointer" title="질문 삭제">🗑️</button>' : '') +
              '</div>' +
            '</div>' +
            '<p class="text-gray-900 text-base sm:text-lg font-medium leading-relaxed my-3 whitespace-pre-wrap keep-all">"' + q.text + '"</p>' +
          '</div>' +
          '<div class="p-5 pt-0">' +
            '<div class="flex justify-between items-center text-xs sm:text-sm text-gray-600 pt-2 border-t border-black/10 mb-3">' +
              '<span class="font-bold text-gray-900">✍️ ' + q.author + '</span>' +
              '<button onclick="toggleLike(\'' + q.id + '\')" class="flex items-center gap-1 font-bold ' + (isLiked ? 'text-red-600' : 'text-gray-500 hover:text-red-500') + ' transition cursor-pointer">' +
                '<i class="' + (isLiked ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i>' +
                '<span>공감 ' + (q.likes || 0) + '</span>' +
              '</button>' +
            '</div>' +
            '<div class="space-y-2 bg-white/70 rounded-xl p-2.5 border border-black/5">' +
              '<div class="space-y-1.5 max-h-36 overflow-y-auto pr-1">' + commentsHtml + '</div>' +
              '<form onsubmit="addComment(\'' + q.id + '\', event)" class="flex gap-1 mt-2">' +
                '<input type="text" id="comment-input-' + q.id + '" placeholder="댓글 작성..." class="flex-1 px-2.5 py-1.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white">' +
                '<button type="submit" class="bg-emerald-700 text-white text-xs sm:text-sm px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-800 whitespace-nowrap shadow-xs cursor-pointer">등록</button>' +
              '</form>' +
            '</div>' +
          '</div>';

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
